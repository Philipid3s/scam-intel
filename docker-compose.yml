services:
  scamintel:
    image: philipid3s/scam-intel:latest
    container_name: scamintel
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "127.0.0.1:3020:3000"
